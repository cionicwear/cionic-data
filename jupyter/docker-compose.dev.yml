version: "3.1"
services:
  jupyter:
    container_name: cionic-data-dev
    build: .
    ports: 
      - '8888:8888'
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/home/jovyan/cionic-data
    volumes:
      - ..:/home/jovyan/cionic-data
    working_dir: /home/jovyan/cionic-data
    command: sh -c "pip install -r /home/jovyan/requirements.txt && PYDEVD_DISABLE_FILE_VALIDATION=1 start-notebook.sh"